name: Apply issue 108 implementation

on:
  push:
    branches:
      - fix/108-offline-recovery

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/108-offline-recovery
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply scoped source transformation
        run: python3 tools/issue108_apply.py

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Commit implementation and remove temporary transformer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/issue108_apply.py .github/workflows/issue108-apply.yml
          git add -A
          git commit -m "Implement offline race recovery for #108"
          git push origin HEAD:fix/108-offline-recovery
