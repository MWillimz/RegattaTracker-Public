name: One-shot PR72 final hardening

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/one-shot-pr72-final-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0
      - name: Correct patch cardinality
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/one_shot_pr72_final_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '    replace_exact("app/src/main/res/values-it/strings.xml", old, new)\n'
          new = '    replace_exact("app/src/main/res/values-it/strings.xml", old, new, count=2 if old == "Accettazione bando di regata" else 1)\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected Italian patch loop shape')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply final hardening patch
        run: python3 .github/scripts/one_shot_pr72_final_hardening.py
      - name: Commit and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/one_shot_pr72_final_hardening.py .github/workflows/one-shot-pr72-final-hardening.yml
          git add -A
          git commit -m "fix: close localization review findings"
          git push origin HEAD:feature/64-localize-ui-strings
