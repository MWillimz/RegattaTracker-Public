name: Apply issue 108 review fixes

on:
  push:
    branches:
      - fix/108-offline-recovery

permissions:
  contents: write

jobs:
  review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/108-offline-recovery
          fetch-depth: 0

      - name: Apply scoped review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          MAIN = Path("app/src/main/java/de/williserv/regattaclient/MainActivity.kt")
          HOME = Path("app/src/main/java/de/williserv/regattaclient/HomeScreen.kt")
          WORKER = Path("app/src/main/java/de/williserv/regattaclient/TelemetryUploadWorker.kt")
          SERVICE = Path("app/src/main/java/de/williserv/regattaclient/RegattaTrackingService.kt")
          STORE = Path("app/src/main/java/de/williserv/regattaclient/ServerConnectionStateStore.kt")
          HOME_TEST = Path("app/src/test/java/de/williserv/regattaclient/HomeUploadStatusTest.kt")

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected 1 match, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Home upload state must describe upload connectivity/backlog only, not race state.
          replace_once(
              HOME,
              '''    val uploadColor = uploadStatusColor(
                  pendingUploadCount = pendingUploadCount,
                  inRace = inRace,
                  disabledColor = MaterialTheme.colorScheme.outlineVariant,
                  noConnection = noConnection
              )
          ''',
              '''    val uploadColor = uploadStatusColor(
                  pendingUploadCount = pendingUploadCount,
                  noConnection = noConnection
              )
          ''',
          )
          replace_once(
              HOME,
              '''            uploadStatusText = shortUploadStatus(
                  pendingUploadCount = pendingUploadCount,
                  inRace = inRace,
                  raceStatusCode = raceStatusCode,
                  noConnection = noConnection,
                  raceDataReady = raceDataReady,
                  pendingText = { pending -> resources.getString(R.string.pending_value, pending) },
                  offText = stringResource(R.string.status_off),
                  waitingText = stringResource(R.string.status_waiting),
                  readyText = stringResource(R.string.status_ready),
                  idleText = stringResource(R.string.status_idle),
                  okText = stringResource(R.string.ok),
                  noConnectionText = stringResource(R.string.status_no_connection)
              ),
          ''',
              '''            uploadStatusText = shortUploadStatus(
                  pendingUploadCount = pendingUploadCount,
                  inRace = inRace,
                  noConnection = noConnection,
                  pendingText = { pending -> resources.getString(R.string.pending_value, pending) },
                  okText = stringResource(R.string.ok),
                  noConnectionText = stringResource(R.string.status_no_connection)
              ),
          ''',
          )
          start = HOME.read_text(encoding="utf-8").index("fun uploadStatusColor(")
          end = HOME.read_text(encoding="utf-8").index("fun raceStatusColor(", start)
          text = HOME.read_text(encoding="utf-8")
          replacement = '''fun uploadStatusColor(
              pendingUploadCount: Long,
              noConnection: Boolean = false
          ): Color {
              if (noConnection) return RegattaRed

              return when {
                  pendingUploadCount <= 10L -> RegattaGreen
                  pendingUploadCount <= 50L -> RegattaOrange
                  else -> RegattaRed
              }
          }

          fun shortUploadStatus(
              pendingUploadCount: Long,
              inRace: Boolean,
              pendingText: (Long) -> String,
              okText: String,
              noConnection: Boolean = false,
              noConnectionText: String = "No connection"
          ): String {
              if (noConnection) {
                  return if (pendingUploadCount > 0L) {
                      "$noConnectionText · ${pendingText(pendingUploadCount)}"
                  } else {
                      noConnectionText
                  }
              }

              if (!inRace && pendingUploadCount > 0L) {
                  return pendingText(pendingUploadCount)
              }

              return if (inRace && pendingUploadCount > 10L) {
                  "$pendingUploadCount"
              } else {
                  okText
              }
          }

          '''
          HOME.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          # Actual successful server communication wins over the generic Android network hint.
          replace_once(
              MAIN,
              '''        if (!ServerConnectionStateStore.hasActiveNetwork(this)) {
                  ServerConnectionStateStore.markNoConnection(this, server)
              }

              serverNoConnection.value =
                  ServerConnectionStateStore.state(this, server) == ServerConnectionState.NO_CONNECTION
          ''',
              '''        val connectionState = ServerConnectionStateStore.state(this, server)
              if (
                  !ServerConnectionStateStore.hasActiveNetwork(this) &&
                  connectionState != ServerConnectionState.REACHABLE
              ) {
                  ServerConnectionStateStore.markNoConnection(this, server)
              }

              serverNoConnection.value =
                  ServerConnectionStateStore.state(this, server) == ServerConnectionState.NO_CONNECTION
          ''',
          )

          # Explicit Register Race remains optional, but transport failures must not leak raw DNS text.
          main = MAIN.read_text(encoding="utf-8")
          reg_start = main.index("    private fun registerForRace(")
          reg_end = main.index("    private fun updateAutoLeaveAfterFinish()", reg_start)
          reg = main[reg_start:reg_end]
          reg = reg.replace(
              '''        thread {
              try {
          ''',
              '''        thread {
              var serverResponded = false
              try {
          ''',
              1,
          )
          reg = reg.replace(
              '''                val responseCode = connection.responseCode
              val body = if (responseCode in 200..299) {
          ''',
              '''                val responseCode = connection.responseCode
              serverResponded = true
              ServerConnectionStateStore.markReachable(this, raceServer.value)
              val body = if (responseCode in 200..299) {
          ''',
              1,
          )
          old_catch = '''            } catch (e: Exception) {
              runOnUiThread {
                  if (currentBoatSetupValues() != registrationBoatSetup) {
                      return@runOnUiThread
                  }
                  registerRaceStatusText.value = getString(R.string.registration_failed, e.message ?: "")
              }
          }
          '''
          new_catch = '''            } catch (e: Exception) {
              if (!serverResponded) {
                  ServerConnectionStateStore.markNoConnection(this, raceServer.value)
              }
              runOnUiThread {
                  if (currentBoatSetupValues() != registrationBoatSetup) {
                      return@runOnUiThread
                  }
                  updateConnectionUiState()
                  registerRaceStatusText.value = if (serverResponded) {
                      getString(R.string.registration_failed, e.message ?: "")
                  } else {
                      getString(R.string.status_no_connection)
                  }
              }
          }
          '''
          if old_catch not in reg:
              raise RuntimeError("registerForRace catch block not found")
          reg = reg.replace(old_catch, new_catch, 1)
          MAIN.write_text(main[:reg_start] + reg + main[reg_end:], encoding="utf-8")

          # A response received from the server proves connectivity even if later local processing fails.
          worker = WORKER.read_text(encoding="utf-8")
          fn_start = worker.index("    private fun uploadSampleBlocking(")
          fn_end = worker.index("    private fun buildIngestUrl(", fn_start)
          fn = worker[fn_start:fn_end]
          fn = fn.replace(
              '''        return try {
          ''',
              '''        var serverResponded = false
              return try {
          ''',
              1,
          )
          fn = fn.replace(
              '''            val responseCode = connection.responseCode
              ServerConnectionStateStore.markReachable(applicationContext, accessContext.serverUrl)
          ''',
              '''            val responseCode = connection.responseCode
              serverResponded = true
              ServerConnectionStateStore.markReachable(applicationContext, accessContext.serverUrl)
          ''',
              1,
          )
          fn = fn.replace(
              '''        } catch (e: Exception) {
              ServerConnectionStateStore.markNoConnection(applicationContext, accessContext.serverUrl)
              publishDebugError(applicationContext.getString(R.string.upload_exception, e.message ?: ""))
          ''',
              '''        } catch (e: Exception) {
              if (!serverResponded) {
                  ServerConnectionStateStore.markNoConnection(applicationContext, accessContext.serverUrl)
              }
              publishDebugError(applicationContext.getString(R.string.upload_exception, e.message ?: ""))
          ''',
              1,
          )
          WORKER.write_text(worker[:fn_start] + fn + worker[fn_end:], encoding="utf-8")

          # Corrupt cached course JSON must not crash an otherwise recoverable service start.
          replace_once(
              SERVICE,
              '''        val course = snapshot.courseJson
                  .takeIf { it.isNotBlank() }
                  ?.let { JSONObject(it) }
          ''',
              '''        val course = snapshot.courseJson
                  .takeIf { it.isNotBlank() }
                  ?.let { raw -> runCatching { JSONObject(raw) }.getOrNull() }
          ''',
          )

          # Avoid writing the same reachability state to SharedPreferences once per uploaded sample.
          replace_once(
              STORE,
              '''        context.applicationContext
              .getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              .edit()
              .putString(KEY_PREFIX + normalized, state.name)
              .apply()
          ''',
              '''        val prefs = context.applicationContext
              .getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              val key = KEY_PREFIX + normalized
              if (prefs.getString(key, "") == state.name) return

              prefs.edit()
                  .putString(key, state.name)
                  .apply()
          ''',
          )

          # Replace upload-status tests with the final connectivity/backlog contract.
          test = HOME_TEST.read_text(encoding="utf-8")
          helper_start = test.index("    private fun shortUploadStatusEnglish(")
          helper_end = test.index("    private fun shortRaceStatusEnglish(", helper_start)
          helper = '''    private fun shortUploadStatusEnglish(
              pendingUploadCount: Long,
              inRace: Boolean,
              noConnection: Boolean = false
          ): String = shortUploadStatus(
              pendingUploadCount = pendingUploadCount,
              inRace = inRace,
              pendingText = { "$it pending" },
              okText = "OK",
              noConnection = noConnection,
              noConnectionText = "No connection"
          )

          '''
          test = test[:helper_start] + helper + test[helper_end:]

          # Remove old upload tests before the race-status tests and insert final contract tests.
          tests_start = test.index("    @Test\n    fun pendingBacklogOutsideRace")
          tests_end = test.index("    @Test\n    fun unavailableRaceData_", tests_start)
          upload_tests = '''    @Test
              fun connectedWithoutBacklog_isOkRegardlessOfRaceState() {
                  assertEquals("OK", shortUploadStatusEnglish(0L, false))
                  assertEquals("OK", shortUploadStatusEnglish(0L, true))
              }

              @Test
              fun pendingBacklogOutsideRace_isShownExplicitly() {
                  assertEquals("37 pending", shortUploadStatusEnglish(37L, false))
                  assertEquals("3 pending", shortUploadStatusEnglish(3L, false))
              }

              @Test
              fun noConnection_hasPriorityAndShowsPendingCount() {
                  assertEquals(
                      "No connection · 7 pending",
                      shortUploadStatusEnglish(7L, true, noConnection = true)
                  )
                  assertEquals(
                      "No connection",
                      shortUploadStatusEnglish(0L, false, noConnection = true)
                  )
              }

              @Test
              fun inRaceBacklog_preservesExistingCompactBehavior() {
                  assertEquals("42", shortUploadStatusEnglish(42L, true))
                  assertEquals("OK", shortUploadStatusEnglish(10L, true))
              }

              @Test
              fun uploadColor_reflectsConnectionAndBacklog() {
                  assertEquals(RegattaRed, uploadStatusColor(0L, noConnection = true))
                  assertEquals(RegattaGreen, uploadStatusColor(0L))
                  assertEquals(RegattaGreen, uploadStatusColor(10L))
                  assertEquals(RegattaOrange, uploadStatusColor(11L))
              }

          '''
          HOME_TEST.write_text(test[:tests_start] + upload_tests + test[tests_end:], encoding="utf-8")

          print("#108 production review fixes applied")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run full Android verification
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyBuildIdentifier test lint assembleDebug

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue108-review-fixes.yml
          git add -A
          git commit -m "Fix #108 production review findings"
          git push origin HEAD:fix/108-offline-recovery
