name: One-shot PR72 Italian article cleanup

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/one-shot-pr72-it-article-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0
      - name: Fix remaining Italian article
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/values-it/strings.xml')
          text = p.read_text(encoding='utf-8')
          old = 'Regata: accetta prima l’bando di regata'
          new = 'Regata: accetta prima il bando di regata'
          if text.count(old) != 1:
              raise SystemExit(f'expected one remaining Italian article issue, found {text.count(old)}')
          text = text.replace(old, new)
          if 'l’bando' in text:
              raise SystemExit('another l’bando occurrence remains')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-pr72-it-article-cleanup.yml
          git add -A
          git commit -m "fix: finish Italian race notice wording"
          git push origin HEAD:feature/64-localize-ui-strings
