name: Staging Release Fallback

on:
  pull_request:
    branches:
      - staging
    types:
      - closed

permissions:
  contents: read
  actions: read

jobs:
  fallback-staging-release:
    name: Recover missing staging push deployment
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Validate merged staging commit
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Merged staging SHA is not an exact 40-character commit SHA: $MERGE_SHA" >&2
            exit 1
          fi

      - name: Allow normal push CI to register
        run: sleep 30

      - name: Check for normal staging push CI
        id: normal_push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUNS="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?event=push&branch=staging&per_page=50")"

          NORMAL_PUSH_RUN_ID="$(jq -r --arg sha "$MERGE_SHA" '
            [.workflow_runs[]
              | select(.name == "CI Checks" and .head_sha == $sha)
              | .id
            ][0] // empty
          ' <<<"$RUNS")"

          if [ -n "$NORMAL_PUSH_RUN_ID" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Normal staging push CI exists: $NORMAL_PUSH_RUN_ID"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "No staging push CI exists for $MERGE_SHA; running guarded fallback."
          fi

      - name: Checkout merged staging source
        if: steps.normal_push.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}

      - name: Run Pages changelog tests
        if: steps.normal_push.outputs.needed == 'true'
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_generate_pages_changelog.py'

      - name: Set up JDK
        if: steps.normal_push.outputs.needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        if: steps.normal_push.outputs.needed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        if: steps.normal_push.outputs.needed == 'true'
        run: chmod +x ./gradlew

      - name: Verify build identifier contract
        if: steps.normal_push.outputs.needed == 'true'
        run: ./gradlew :app:verifyBuildIdentifier

      - name: Run tests
        if: steps.normal_push.outputs.needed == 'true'
        run: ./gradlew test

      - name: Run lint
        if: steps.normal_push.outputs.needed == 'true'
        run: ./gradlew lint

      - name: Build debug APK
        if: steps.normal_push.outputs.needed == 'true'
        run: ./gradlew assembleDebug

      - name: Validate dispatch configuration
        if: steps.normal_push.outputs.needed == 'true'
        shell: bash
        env:
          RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_DISPATCH_TOKEN:-}" ]; then
            echo "Required Actions secret is missing: RELEASE_DISPATCH_TOKEN" >&2
            exit 1
          fi

      - name: Trigger private staging release
        if: steps.normal_push.outputs.needed == 'true'
        shell: bash
        env:
          RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          PAYLOAD="$(jq -n \
            --arg ref "master" \
            --arg source_sha "$MERGE_SHA" \
            '{ref: $ref, inputs: {source_sha: $source_sha, force_rebuild: false}}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELEASE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MWillimz/RegattaTracker/actions/workflows/staging-release-apk.yml/dispatches \
            -d "$PAYLOAD"

          echo "Dispatched fallback staging release for public source $MERGE_SHA"
