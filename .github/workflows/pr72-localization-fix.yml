name: Apply PR 72 localization review fixes

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/pr72-localization-fix.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: python3 .github/pr72_fix.py

      - name: Validate patch
        run: git diff --check

      - name: Commit fixes and remove helpers
        run: |
          rm .github/pr72_fix.py .github/workflows/pr72-localization-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve legacy localized race state"
          git push origin HEAD:feature/64-localize-ui-strings
