name: Apply localization wording QA

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-localization-wording.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0

      - name: Apply reviewed wording corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('app/src/main/res')
          files = {
              'en': root / 'values/strings.xml',
              'de': root / 'values-de/strings.xml',
              'fr': root / 'values-fr/strings.xml',
              'it': root / 'values-it/strings.xml',
              'es': root / 'values-es/strings.xml',
          }
          test = Path('app/src/test/java/de/williserv/regattaclient/LocalizationResourcesTest.kt')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:160]!r}')
              path.write_text(text.replace(old, new, 1))

          def replace_all_checked(path: Path, old: str, new: str, minimum: int = 1) -> None:
              text = path.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} matches, found {count}: {old!r}')
              path.write_text(text.replace(old, new))

          # Keep the legal-resource block consistently formatted in every locale.
          for path in files.values():
              text = path.read_text()
              text = text.replace('\n        <string name="legal_notice_body">', '\n    <string name="legal_notice_body">')
              text = text.replace('\n<string name="third_party_license_unavailable">', '\n    <string name="third_party_license_unavailable">')
              path.write_text(text)

          de = files['de']
          replace_once(de, '<string name="legal_about">Rechtliches / Über</string>', '<string name="legal_about">Rechtliches / Über die App</string>')
          replace_once(de, '<string name="settings_about_legal">Einstellungen / Über / Rechtliches</string>', '<string name="settings_about_legal">Einstellungen / Über die App / Rechtliches</string>')
          replace_all_checked(de, 'Regattahinweis', 'Ausschreibung', minimum=8)
          replace_once(de, '<string name="accept_notice">Hinweis akzeptieren</string>', '<string name="accept_notice">Ausschreibung akzeptieren</string>')
          replace_all_checked(de, 'Regatta-Tracking', 'Regatta-Aufzeichnung', minimum=2)
          replace_all_checked(de, 'Trackingdaten', 'Aufzeichnungsdaten', minimum=2)
          replace_once(de, '<string name="clear_status">klar</string>', '<string name="clear_status">frei</string>')

          fr = files['fr']
          replace_once(fr, '<string name="mark_skipped">%1$s — ignorée</string>', '<string name="mark_skipped">%1$s — omise</string>')
          replace_once(fr, '<string name="mark_skipped_compact">%1$d %2$s [ignorée]</string>', '<string name="mark_skipped_compact">%1$d %2$s [omise]</string>')
          replace_once(fr, '<string name="gps_accuracy_unknown">GPS: --</string>', '<string name="gps_accuracy_unknown">GPS : --</string>')
          replace_once(fr, '<string name="next_return_start">Suivant : repasser la ligne de départ</string>', '<string name="next_return_start">Suivant : refranchir la ligne de départ</string>')
          replace_once(fr, 'Revenez derrière la ligne de départ ou ignorez cet avertissement et continuez le parcours.', 'Refranchissez la ligne de départ en sens inverse ou ignorez cet avertissement et continuez le parcours.')
          replace_once(fr, '<string name="clear_status">clair</string>', '<string name="clear_status">en règle</string>')
          replace_once(fr, '<string name="upload_exception">Exception d’envoi : %1$s</string>', '<string name="upload_exception">Erreur d’envoi : %1$s</string>')
          replace_once(fr, 'Route fond (COG)', 'Route sur le fond (COG)')
          replace_once(fr, 'Vitesse fond (SOG)', 'Vitesse sur le fond (SOG)')

          it = files['it']
          replace_all_checked(it, 'Avviso di regata', 'Bando di regata', minimum=4)
          replace_all_checked(it, 'avviso di regata', 'bando di regata', minimum=4)
          replace_once(it, '<string name="accept_notice">Accetta avviso</string>', '<string name="accept_notice">Accetta bando</string>')
          replace_once(it, '<string name="mark_skipped">%1$s — saltata</string>', '<string name="mark_skipped">%1$s — omessa</string>')
          replace_once(it, '<string name="mark_skipped_compact">%1$d %2$s [saltata]</string>', '<string name="mark_skipped_compact">%1$d %2$s [omessa]</string>')
          replace_once(it, '<string name="manual_tracking_stopped">Tracciamento manuale fermato</string>', '<string name="manual_tracking_stopped">Tracciamento manuale interrotto</string>')
          replace_once(it, '<string name="next_return_start">Prossimo: torna oltre la linea di partenza</string>', '<string name="next_return_start">Prossimo: riattraversa la linea di partenza</string>')
          replace_once(it, 'Torna oltre la linea di partenza oppure ignora questo avviso e continua il percorso.', 'Riattraversa la linea di partenza oppure ignora questo avviso e continua il percorso.')
          replace_once(it, '<string name="clear_status">libero</string>', '<string name="clear_status">regolare</string>')

          es = files['es']
          replace_all_checked(es, 'Aviso de regata', 'Anuncio de regata', minimum=4)
          replace_all_checked(es, 'aviso de regata', 'anuncio de regata', minimum=4)
          replace_once(es, '<string name="accept_notice">Aceptar aviso</string>', '<string name="accept_notice">Aceptar anuncio</string>')
          replacements = {
              '<string name="upload">Carga</string>': '<string name="upload">Envío</string>',
              '<string name="upload_ready">Carga: lista</string>': '<string name="upload_ready">Envío: listo</string>',
              '<string name="upload_all_sent">Carga: todo enviado</string>': '<string name="upload_all_sent">Envío: todo enviado</string>',
              '<string name="upload_pending">Carga: %1$d pendientes</string>': '<string name="upload_pending">Envío: %1$d pendientes</string>',
              '<string name="upload_prefix">Carga:</string>': '<string name="upload_prefix">Envío:</string>',
              '<string name="upload_worker_pending">Carga: %1$s · %2$d pendientes</string>': '<string name="upload_worker_pending">Envío: %1$s · %2$d pendientes</string>',
              '<string name="upload_worker">Carga: %1$s</string>': '<string name="upload_worker">Envío: %1$s</string>',
              '<string name="upload_error_code">Error de carga %1$d: %2$s</string>': '<string name="upload_error_code">Error de envío %1$d: %2$s</string>',
              '<string name="upload_exception">Excepción de carga: %1$s</string>': '<string name="upload_exception">Error de envío: %1$s</string>',
              '<string name="clear_status">libre</string>': '<string name="clear_status">sin OCS</string>',
          }
          for old, new in replacements.items():
              replace_once(es, old, new)

          # Pin the reviewed terminology so later resource edits cannot silently regress it.
          text = test.read_text()
          replace_once(
              test,
              '        assertEquals("Regatta: nicht geladen", resources.getString(R.string.race_not_loaded))\n',
              '        assertEquals("Regatta: nicht geladen", resources.getString(R.string.race_not_loaded))\n'
              '        assertEquals("Ausschreibung", resources.getString(R.string.race_notice))\n'
              '        assertEquals("frei", resources.getString(R.string.clear_status))\n'
          )
          replace_once(
              test,
              '        assertEquals("Course : non chargée", resources.getString(R.string.race_not_loaded))\n',
              '        assertEquals("Course : non chargée", resources.getString(R.string.race_not_loaded))\n'
              '        assertEquals("en règle", resources.getString(R.string.clear_status))\n'
              '        assertEquals("Bouée — omise", resources.getString(R.string.mark_skipped, "Bouée"))\n'
          )
          replace_once(
              test,
              '        assertEquals("Regata: non caricata", resources.getString(R.string.race_not_loaded))\n',
              '        assertEquals("Regata: non caricata", resources.getString(R.string.race_not_loaded))\n'
              '        assertEquals("Bando di regata", resources.getString(R.string.race_notice))\n'
              '        assertEquals("Tracciamento manuale interrotto", resources.getString(R.string.manual_tracking_stopped))\n'
          )
          replace_once(
              test,
              '        assertEquals("Regata: no cargada", resources.getString(R.string.race_not_loaded))\n',
              '        assertEquals("Regata: no cargada", resources.getString(R.string.race_not_loaded))\n'
              '        assertEquals("Anuncio de regata", resources.getString(R.string.race_notice))\n'
              '        assertEquals("Envío", resources.getString(R.string.upload))\n'
          )
          PY

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-localization-wording.yml
          git add app/src/main/res/values/strings.xml \
                  app/src/main/res/values-de/strings.xml \
                  app/src/main/res/values-fr/strings.xml \
                  app/src/main/res/values-it/strings.xml \
                  app/src/main/res/values-es/strings.xml \
                  app/src/test/java/de/williserv/regattaclient/LocalizationResourcesTest.kt
          git diff --cached --check
          git commit -m "Refine reviewed localization wording"
          git push origin HEAD:feature/64-localize-ui-strings
