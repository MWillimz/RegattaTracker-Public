name: Harden localized course display fallback

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-course-display-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_course_display_fallback.py
      - name: Commit and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-course-display-fallback.yml .github/scripts/patch_course_display_fallback.py
          git add app/src/main/java/de/williserv/regattaclient/CourseScreen.kt app/src/test/java/de/williserv/regattaclient/CourseProgressMarkStateTest.kt
          git diff --cached --check
          git commit -m "Localize course skipped-mark display fallback"
          git push origin HEAD:feature/64-localize-ui-strings
