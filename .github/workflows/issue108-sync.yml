name: Sync issue 108 with dev

on:
  push:
    branches:
      - fix/108-offline-recovery

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/108-offline-recovery
          fetch-depth: 0

      - name: Merge current dev without committing yet
        run: |
          git fetch origin dev
          git merge --no-commit --no-ff origin/dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests on merged tree
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Commit merged tree and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue108-sync.yml
          git add -A
          git commit -m "Sync #108 with latest dev"
          git push origin HEAD:fix/108-offline-recovery
