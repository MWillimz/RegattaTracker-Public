name: Diagnose locale key parity

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/diagnose-locale-keys.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0
      - name: Print locale key differences
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('app/src/main/res')
          def keys(folder):
              tree = ET.parse(root / folder / 'strings.xml')
              return {n.attrib['name'] for n in tree.getroot().findall('string')}
          base = keys('values')
          print('DEFAULT_COUNT', len(base))
          for folder in ['values-de','values-fr','values-it','values-es']:
              k = keys(folder)
              print(folder, 'COUNT', len(k))
              print(folder, 'MISSING', sorted(base-k))
              print(folder, 'EXTRA', sorted(k-base))
          PY
      - name: Remove diagnostic helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-locale-keys.yml
          git commit -m "Remove locale key diagnostics helper"
          git push origin HEAD:feature/64-localize-ui-strings
