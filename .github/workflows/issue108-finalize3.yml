name: Finalize issue 108 implementation v3

on:
  push:
    branches:
      - fix/108-offline-recovery

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/108-offline-recovery
          fetch-depth: 0

      - name: Apply scoped line-based cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          MAIN = Path("app/src/main/java/de/williserv/regattaclient/MainActivity.kt")
          HOME = Path("app/src/main/java/de/williserv/regattaclient/HomeScreen.kt")
          TEST = Path("app/src/test/java/de/williserv/regattaclient/HomeUploadStatusTest.kt")

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: expected exactly one match for {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def function_bounds(lines, start_text, end_text):
              start = next(i for i, line in enumerate(lines) if start_text in line)
              end = next(i for i in range(start + 1, len(lines)) if end_text in lines[i])
              return start, end

          # 1) Enter Race readiness: local snapshot + Boat Setup, but never reuse a clearly obsolete
          # stable-series run as though it were the next occurrence.
          replace_once(
              MAIN,
              """    private fun canEnterRaceNow(): Boolean {
                  return canEnterRaceWithLocalState(
                      raceDataReady = raceDataReady.value,
                      setupConfirmed = setupConfirmed.value
                  )
              }
          """,
              """    private fun canEnterRaceNow(): Boolean {
                  val isSeriesAccess =
                      raceSeriesDisplayMetadata.value.runName.isNotBlank() ||
                          (resolvedEventName.value.isNotBlank() && resolvedEventName.value != raceEvent.value)
                  val cachedSeriesRunObsolete = isCachedSeriesRunObsolete(
                      isSeriesAccess = isSeriesAccess,
                      status = rawRaceStatus,
                      stopEpochMillis = parseServerTimeToMillis(rawRaceStop),
                      nowEpochMillis = System.currentTimeMillis()
                  )

                  return canEnterRaceWithLocalState(
                      raceDataReady = raceDataReady.value,
                      setupConfirmed = setupConfirmed.value,
                      cachedSeriesRunObsolete = cachedSeriesRunObsolete
                  )
              }
          """,
          )

          # 2) Once the entry point is durable, WorkManager scheduling itself must not make Enter Race
          # fail or cause a duplicate on retry; app startup will enqueue pending rows again if needed.
          replace_once(
              MAIN,
              "        TelemetryUploadScheduler.enqueue(this)\n        return true\n    }\n\n    private fun enterRace() {",
              "        runCatching { TelemetryUploadScheduler.enqueue(this) }\n        return true\n    }\n\n    private fun enterRace() {",
          )

          # 3) Legal fetch/accept: transport failures are No connection, not raw DNS exceptions.
          lines = MAIN.read_text(encoding="utf-8").splitlines()

          def harden_network_section(lines, start_text, end_text, catch_kind):
              start, end = function_bounds(lines, start_text, end_text)
              section = lines[start:end]

              thread_idx = next(i for i, line in enumerate(section) if line.strip() == "thread {")
              if not any("serverResponded = false" in line for line in section):
                  section.insert(thread_idx + 1, "            var serverResponded = false")

              response_idx = next(i for i, line in enumerate(section) if "val responseCode = connection.responseCode" in line)
              if not any("serverResponded = true" in line for line in section):
                  indent = section[response_idx][:len(section[response_idx]) - len(section[response_idx].lstrip())]
                  section[response_idx + 1:response_idx + 1] = [
                      indent + "serverResponded = true",
                      indent + "ServerConnectionStateStore.markReachable(this, access.server)",
                  ]

              catch_idx = next(i for i, line in enumerate(section) if line.strip() == "} catch (e: Exception) {")
              finally_idx = next(i for i in range(catch_idx + 1, len(section)) if section[i].strip() == "} finally {")

              if catch_kind == "fetch":
                  replacement = [
                      "            } catch (e: Exception) {",
                      "                if (!serverResponded) {",
                      "                    ServerConnectionStateStore.markNoConnection(this, access.server)",
                      "                }",
                      "                runOnUiThread {",
                      "                    if (!isCurrentAllowedLegalContext(compatibilityContext)) {",
                      "                        return@runOnUiThread",
                      "                    }",
                      "                    updateConnectionUiState()",
                      "                    raceLegalStatusText.value = if (serverResponded) {",
                      "                        getString(R.string.legal_text_failed, e.message ?: \"\")",
                      "                    } else {",
                      "                        getString(R.string.status_no_connection)",
                      "                    }",
                      "                    raceLegalAccepted.value = false",
                      "                    currentScreen.value = Screen.RACE",
                      "                }",
                  ]
              else:
                  replacement = [
                      "            } catch (e: Exception) {",
                      "                if (!serverResponded) {",
                      "                    ServerConnectionStateStore.markNoConnection(this, access.server)",
                      "                }",
                      "                runOnUiThread {",
                      "                    if (",
                      "                        !isCurrentActionableLegalDocument(document) ||",
                      "                        !hasSameLegalBoatIdentity(currentBoatSetupValues(), acceptedBoatSetup)",
                      "                    ) {",
                      "                        return@runOnUiThread",
                      "                    }",
                      "                    updateConnectionUiState()",
                      "                    raceLegalAccepted.value = false",
                      "                    raceLegalAcceptStatusText.value = if (serverResponded) {",
                      "                        getString(R.string.accept_failed, e.message ?: \"\")",
                      "                    } else {",
                      "                        getString(R.string.status_no_connection)",
                      "                    }",
                      "                }",
                  ]

              section[catch_idx:finally_idx] = replacement
              return lines[:start] + section + lines[end:]

          lines = harden_network_section(
              lines,
              "private fun fetchRaceLegalTextAfterCompatibility(",
              "private fun acceptRaceLegalAndLoadRaceData()",
              "fetch",
          )
          lines = harden_network_section(
              lines,
              "private fun acceptRaceLegalAndLoadRaceData()",
              "private fun updateLocalRaceStatus()",
              "accept",
          )
          MAIN.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 4) Upload summary has no Legal/registration inputs anymore.
          lines = HOME.read_text(encoding="utf-8").splitlines()
          start, end = function_bounds(lines, "fun HomeScreen(", "fun TopEventName(")
          section = lines[start:end]
          section = [line for line in section if line.strip() not in {
              "raceLegalAccepted: Boolean,",
              "raceLegalAccepted = raceLegalAccepted,",
              "hasRaceSetup = raceEvent.isNotBlank(),",
              "blockedText = stringResource(R.string.status_blocked),",
          }]
          lines = lines[:start] + section + lines[end:]

          start, end = function_bounds(lines, "fun shortUploadStatus(", "fun raceStatusColor(")
          section = lines[start:end]
          section = [line for line in section if line.strip() not in {
              "raceLegalAccepted: Boolean,",
              "hasRaceSetup: Boolean,",
              "blockedText: String,",
          }]
          lines = lines[:start] + section + lines[end:]
          HOME.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Remove the now-unused HomeScreen argument at its one call site.
          lines = MAIN.read_text(encoding="utf-8").splitlines()
          start, end = function_bounds(lines, "Screen.HOME -> HomeScreen(", "Screen.RACE_LEGAL -> RaceLegalScreen(")
          section = [line for line in lines[start:end] if line.strip() != "raceLegalAccepted = raceLegalAccepted.value,"]
          MAIN.write_text("\n".join(lines[:start] + section + lines[end:]) + "\n", encoding="utf-8")

          # The test helper deliberately still varies Legal/setup booleans; production ignores them.
          lines = TEST.read_text(encoding="utf-8").splitlines()
          start, end = function_bounds(lines, "private fun shortUploadStatusEnglish(", "private fun shortRaceStatusEnglish(")
          section = [line for line in lines[start:end] if line.strip() not in {
              "raceLegalAccepted = raceLegalAccepted,",
              "hasRaceSetup = hasRaceSetup,",
              "blockedText = \"blocked\",",
          }]
          TEST.write_text("\n".join(lines[:start] + section + lines[end:]) + "\n", encoding="utf-8")

          print("Final #108 cleanup applied")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run full Android verification
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyBuildIdentifier test lint assembleDebug

      - name: Commit final implementation and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue108-finalize.yml .github/workflows/issue108-finalize2.yml .github/workflows/issue108-finalize3.yml
          git add -A
          git commit -m "Finalize offline race recovery for #108"
          git push origin HEAD:fix/108-offline-recovery
