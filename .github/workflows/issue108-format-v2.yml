name: Format issue 108 touched blocks

on:
  push:
    branches:
      - fix/108-offline-recovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/108-offline-recovery
          fetch-depth: 0

      - name: Apply formatting cleanup
        run: python3 .github/scripts/issue108_format.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyBuildIdentifier test lint assembleDebug

      - name: Commit clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue108-format-final.yml
          git rm .github/workflows/issue108-format-v2.yml
          git rm .github/scripts/issue108_format.py
          git add -A
          git commit -m "Normalize #108 reviewed code formatting"
          git push origin HEAD:fix/108-offline-recovery
