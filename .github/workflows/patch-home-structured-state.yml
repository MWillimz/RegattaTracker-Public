name: Apply Home structured state hardening

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-home-structured-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_home_structured_state.py
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-home-structured-state.yml .github/scripts/patch_home_structured_state.py
          git add app/src/main/java/de/williserv/regattaclient/MainActivity.kt app/src/main/java/de/williserv/regattaclient/HomeScreen.kt app/src/test/java/de/williserv/regattaclient/HomeUploadStatusTest.kt
          git diff --cached --check
          git commit -m "Use structured Home state instead of localized text"
          git push origin HEAD:feature/64-localize-ui-strings
