name: Apply Home structured state hardening

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-home-structured-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_home_structured_state.py')
          text = path.read_text()
          old = '''    home,
              '    uploadStatusText: String,\\n    debugErrorText: String,\\n',
              '    uploadStatusText: String,\\n    pendingUploadCount: Long,\\n    debugErrorText: String,\\n'
          '''
          new = '''    home,
              '    statusText: String,\\n    rowCountText: String,\\n    uploadStatusText: String,\\n    debugErrorText: String,\\n    serviceStatusText: String,\\n',
              '    statusText: String,\\n    rowCountText: String,\\n    uploadStatusText: String,\\n    pendingUploadCount: Long,\\n    debugErrorText: String,\\n    serviceStatusText: String,\\n'
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one script anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/patch_home_structured_state.py
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-home-structured-state.yml .github/scripts/patch_home_structured_state.py
          git add app/src/main/java/de/williserv/regattaclient/MainActivity.kt app/src/main/java/de/williserv/regattaclient/HomeScreen.kt app/src/test/java/de/williserv/regattaclient/HomeUploadStatusTest.kt
          git diff --cached --check
          git commit -m "Use structured Home state instead of localized text"
          git push origin HEAD:feature/64-localize-ui-strings
