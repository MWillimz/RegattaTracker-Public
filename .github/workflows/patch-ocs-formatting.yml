name: Clean OCS block formatting

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-ocs-formatting.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0
      - name: Clean formatting
        run: python3 .github/scripts/format_ocs_block.py
      - name: Commit and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-ocs-formatting.yml .github/scripts/format_ocs_block.py
          git add app/src/main/java/de/williserv/regattaclient/MainActivity.kt
          git diff --cached --check
          git commit -m "Clean OCS state block formatting"
          git push origin HEAD:feature/64-localize-ui-strings
