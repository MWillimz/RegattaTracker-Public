name: Apply race persistence hardening

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-race-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0

      - name: Apply persistence patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('app/src/main/java/de/williserv/regattaclient/MainActivity.kt')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          def replace_count(old: str, new: str, expected: int) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} matches, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          def sub_once(pattern: str, replacement: str) -> None:
              global text
              matches = re.findall(pattern, text, flags=re.S)
              if len(matches) != 1:
                  raise SystemExit(f'Expected one regex match, found {len(matches)}: {pattern[:100]!r}')
              text = re.sub(pattern, lambda _: replacement, text, count=1, flags=re.S)

          replace_once(
              '    private var raceStartEpochMillis: Long? = null\n'
              '    private var currentRaceStatus = ""\n'
              '    private var raceDataFetchRunning = false\n',
              '    private var raceStartEpochMillis: Long? = null\n'
              '    private var currentRaceStatus = ""\n'
              '    private var rawRaceStatus = ""\n'
              '    private var rawRaceStart = ""\n'
              '    private var rawRaceStop = ""\n'
              '    private var rawRaceInfo = ""\n'
              '    private var rawRaceCourseJson = ""\n'
              '    private var rawRaceCourseShortened = false\n'
              '    private var raceDataFetchRunning = false\n'
          )

          replace_once(
              '                                if (raceDataReady.value && raceStatusText.value.contains("finished", ignoreCase = true)) {\n',
              '                                if (raceDataReady.value && currentRaceStatus.equals("finished", ignoreCase = true)) {\n'
          )

          new_load = textwrap.indent(textwrap.dedent('''\
          private fun loadRaceSetup() {
              val prefs = getSharedPreferences(racePrefsName, Context.MODE_PRIVATE)

              raceServer.value = prefs.getString("race_server", raceServer.value) ?: raceServer.value
              raceEvent.value = prefs.getString("race_event", raceEvent.value) ?: raceEvent.value
              raceSecret.value = prefs.getString("race_secret", raceSecret.value) ?: raceSecret.value
              resolvedEventName.value = prefs.getString("resolved_event_name", "") ?: ""
              raceSeriesDisplayMetadata.value = SeriesDisplayMetadata(
                  runName = prefs.getString("series_run_name", "").orEmpty(),
                  occurrenceNo = prefs.getInt("series_occurrence_no", 0).takeIf { it > 0 },
                  plannedRaceCount = prefs.getInt("series_planned_race_count", 0).takeIf { it > 0 }
              )

              raceDataReady.value = prefs.getBoolean("race_data_ready", false)
              if (resolvedEventName.value.isBlank()) {
                  raceDataReady.value = false
              }

              if (!raceDataReady.value) {
                  currentRaceStatus = ""
                  raceStartEpochMillis = null
                  return
              }

              val hasRawState =
                  prefs.getInt("race_raw_state_version", 0) >= RACE_RAW_STATE_VERSION

              if (hasRawState) {
                  rawRaceStatus = prefs.getString("race_status_raw", "").orEmpty()
                  rawRaceStart = prefs.getString("race_start_raw", "").orEmpty()
                  rawRaceStop = prefs.getString("race_stop_raw", "").orEmpty()
                  rawRaceInfo = prefs.getString("race_info_raw", "").orEmpty()
                  rawRaceCourseJson = prefs.getString("race_course_json_raw", "").orEmpty()
                  rawRaceCourseShortened = prefs.getBoolean("race_course_shortened_raw", false)
                  renderRawRaceSetup()
              } else {
                  raceStatusText.value = prefs.getString("race_status_text", raceStatusText.value) ?: raceStatusText.value
                  raceStartText.value = prefs.getString("race_start_text", raceStartText.value) ?: raceStartText.value
                  raceStopText.value = prefs.getString("race_stop_text", raceStopText.value) ?: raceStopText.value
                  raceCourseText.value = prefs.getString("race_course_text", raceCourseText.value) ?: raceCourseText.value
                  raceStartLineText.value = prefs.getString("race_start_line_text", raceStartLineText.value) ?: raceStartLineText.value
                  raceFinishLineText.value = prefs.getString("race_finish_line_text", raceFinishLineText.value) ?: raceFinishLineText.value
                  raceMarksText.value = prefs.getString("race_marks_text", raceMarksText.value) ?: raceMarksText.value
                  raceInfoText.value = prefs.getString("race_info_text", raceInfoText.value) ?: raceInfoText.value
                  raceShortenedText.value = prefs.getString("race_shortened_text", raceShortenedText.value) ?: raceShortenedText.value

                  rawRaceStatus = legacyDisplayPayload(raceStatusText.value)
                  rawRaceStart = legacyDisplayPayload(raceStartText.value)
                  rawRaceStop = legacyDisplayPayload(raceStopText.value)
                  rawRaceInfo = legacyDisplayPayload(raceInfoText.value)
                  currentRaceStatus = rawRaceStatus
                  raceStartEpochMillis = parseServerTimeToMillis(rawRaceStart)
              }
          }

          private fun renderRawRaceSetup() {
              raceStatusText.value = if (rawRaceStatus.isBlank()) {
                  getString(R.string.race_not_loaded)
              } else {
                  getString(R.string.race_value, rawRaceStatus)
              }
              raceStartText.value = if (rawRaceStart.isBlank() || rawRaceStart == "--") {
                  getString(R.string.start_unknown)
              } else {
                  getString(R.string.start_value, rawRaceStart)
              }
              raceStopText.value = if (rawRaceStop.isBlank() || rawRaceStop == "--") {
                  getString(R.string.stop_unknown)
              } else {
                  getString(R.string.stop_value, rawRaceStop)
              }
              raceInfoText.value = if (rawRaceInfo.isBlank() || rawRaceInfo == "--") {
                  getString(R.string.info_unknown)
              } else {
                  getString(R.string.info_value, rawRaceInfo)
              }
              raceShortenedText.value = if (rawRaceCourseShortened) {
                  getString(R.string.course_shortened_yes)
              } else {
                  getString(R.string.course_shortened_no)
              }

              val courseObj = rawRaceCourseJson
                  .takeIf { it.isNotBlank() }
                  ?.let { raw -> runCatching { JSONObject(raw) }.getOrNull() }
              val courseSummary = buildCourseSummary(
                  courseObj = courseObj,
                  courseShortened = rawRaceCourseShortened
              )

              raceCourseText.value = courseSummary.courseText
              raceStartLineText.value = courseSummary.startLineText
              raceFinishLineText.value = courseSummary.finishLineText
              raceMarksText.value = courseSummary.marksText
              courseMapMarks.value = buildCourseMapMarks(
                  courseObj = courseObj,
                  courseShortened = rawRaceCourseShortened
              )

              currentRaceStatus = rawRaceStatus
              raceStartEpochMillis = parseServerTimeToMillis(rawRaceStart)
          }
          '''), '    ')

          sub_once(
              r'    private fun loadRaceSetup\(\) \{.*?\n    \}\n\n    private fun resetRaceLegalState',
              new_load + '\n\n    private fun resetRaceLegalState'
          )

          reset_anchor = (
              '        ocsText.value = getString(R.string.ocs_unknown)\n\n'
              '        currentRaceStatus = ""\n'
          )
          reset_replacement = (
              '        ocsText.value = getString(R.string.ocs_unknown)\n\n'
              '        rawRaceStatus = ""\n'
              '        rawRaceStart = ""\n'
              '        rawRaceStop = ""\n'
              '        rawRaceInfo = ""\n'
              '        rawRaceCourseJson = ""\n'
              '        rawRaceCourseShortened = false\n'
              '        currentRaceStatus = ""\n'
          )
          replace_count(reset_anchor, reset_replacement, 2)

          replace_once(
              '            .putInt("series_planned_race_count", raceSeriesDisplayMetadata.value.plannedRaceCount ?: 0)\n'
              '            .putString("race_status_text", raceStatusText.value)\n',
              '            .putInt("series_planned_race_count", raceSeriesDisplayMetadata.value.plannedRaceCount ?: 0)\n'
              '            .putInt("race_raw_state_version", RACE_RAW_STATE_VERSION)\n'
              '            .putString("race_status_raw", rawRaceStatus)\n'
              '            .putString("race_start_raw", rawRaceStart)\n'
              '            .putString("race_stop_raw", rawRaceStop)\n'
              '            .putString("race_info_raw", rawRaceInfo)\n'
              '            .putString("race_course_json_raw", rawRaceCourseJson)\n'
              '            .putBoolean("race_course_shortened_raw", rawRaceCourseShortened)\n'
              '            .putString("race_status_text", raceStatusText.value)\n'
          )

          sub_once(
              r'        val registrationTimestamp = RaceRegistrationPolicy\.registrationTimestamp\(\n.*?\n        \)',
              '        val registrationTimestamp = RaceRegistrationPolicy.registrationTimestamp(\n'
              '            rawRaceStart.ifBlank { legacyDisplayPayload(raceStartText.value) }\n'
              '        )'
          )

          fetch_replacement = textwrap.indent(textwrap.dedent('''\
          val courseJson = courseObj?.toString().orEmpty()

          runOnUiThread {
              adoptResolvedEventName(responseResolvedEventName)
              raceSeriesDisplayMetadata.value = parsedSeriesDisplayMetadata
              rawRaceStatus = status
              rawRaceStart = start
              rawRaceStop = stop
              rawRaceInfo = raceInfo
              rawRaceCourseJson = courseJson
              rawRaceCourseShortened = courseShortened
              raceDataReady.value = true
              raceStartFlags.value = parsedStartFlags
              renderRawRaceSetup()
              saveRaceSetup()
          '''), '                ')

          sub_once(
              r'                val courseSummary = buildCourseSummary\(.*?\n                    saveRaceSetup\(\)',
              fetch_replacement.rstrip()
          )

          replace_once(
              '                "Marks: ${markNames.joinToString(", ")}"\n',
              '                getString(R.string.marks_value, markNames.joinToString(", "))\n'
          )

          path.write_text(text)
          PY

      - name: Commit patched source and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-race-persistence.yml
          git add app/src/main/java/de/williserv/regattaclient/MainActivity.kt
          git diff --cached --check
          git commit -m "Persist raw race state across locale changes"
          git push origin HEAD:feature/64-localize-ui-strings
