name: Apply issue 108 review fixes v2

on:
  push:
    branches:
      - fix/108-offline-recovery

permissions:
  contents: write

jobs:
  review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/108-offline-recovery
          fetch-depth: 0

      - name: Apply scoped review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          MAIN = Path("app/src/main/java/de/williserv/regattaclient/MainActivity.kt")
          HOME = Path("app/src/main/java/de/williserv/regattaclient/HomeScreen.kt")
          WORKER = Path("app/src/main/java/de/williserv/regattaclient/TelemetryUploadWorker.kt")
          SERVICE = Path("app/src/main/java/de/williserv/regattaclient/RegattaTrackingService.kt")
          STORE = Path("app/src/main/java/de/williserv/regattaclient/ServerConnectionStateStore.kt")
          HOME_TEST = Path("app/src/test/java/de/williserv/regattaclient/HomeUploadStatusTest.kt")

          def replace_between(path, start_marker, end_marker, replacement):
              text = path.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          replace_between(
              HOME,
              "    val uploadColor = uploadStatusColor(",
              "\n\n    val showCourseShortened",
              '''    val uploadColor = uploadStatusColor(
              pendingUploadCount = pendingUploadCount,
              noConnection = noConnection
          )'''
          )
          replace_between(
              HOME,
              "            uploadStatusText = shortUploadStatus(",
              "\n            uploadColor = uploadColor",
              '''            uploadStatusText = shortUploadStatus(
              pendingUploadCount = pendingUploadCount,
              inRace = inRace,
              noConnection = noConnection,
              pendingText = { pending -> resources.getString(R.string.pending_value, pending) },
              okText = stringResource(R.string.ok),
              noConnectionText = stringResource(R.string.status_no_connection)
          ),'''
          )
          replace_between(
              HOME,
              "fun uploadStatusColor(",
              "fun raceStatusColor(",
              '''fun uploadStatusColor(
              pendingUploadCount: Long,
              noConnection: Boolean = false
          ): Color {
              if (noConnection) return RegattaRed
              return when {
                  pendingUploadCount <= 10L -> RegattaGreen
                  pendingUploadCount <= 50L -> RegattaOrange
                  else -> RegattaRed
              }
          }

          fun shortUploadStatus(
              pendingUploadCount: Long,
              inRace: Boolean,
              pendingText: (Long) -> String,
              okText: String,
              noConnection: Boolean = false,
              noConnectionText: String = "No connection"
          ): String {
              if (noConnection) {
                  return if (pendingUploadCount > 0L) {
                      "$noConnectionText · ${pendingText(pendingUploadCount)}"
                  } else {
                      noConnectionText
                  }
              }
              if (!inRace && pendingUploadCount > 0L) return pendingText(pendingUploadCount)
              return if (inRace && pendingUploadCount > 10L) "$pendingUploadCount" else okText
          }

          '''
          )

          replace_between(
              MAIN,
              "    private fun updateConnectionUiState() {",
              "    private fun startRaceDataRefresh() {",
              '''    private fun updateConnectionUiState() {
              val server = raceServer.value
              if (server.isBlank()) {
                  serverNoConnection.value = false
                  return
              }

              val connectionState = ServerConnectionStateStore.state(this, server)
              if (
                  !ServerConnectionStateStore.hasActiveNetwork(this) &&
                  connectionState != ServerConnectionState.REACHABLE
              ) {
                  ServerConnectionStateStore.markNoConnection(this, server)
              }

              serverNoConnection.value =
                  ServerConnectionStateStore.state(this, server) == ServerConnectionState.NO_CONNECTION
          }

          '''
          )

          main = MAIN.read_text(encoding="utf-8")
          start = main.index("    private fun registerForRace(")
          end = main.index("    private fun updateAutoLeaveAfterFinish()", start)
          reg = main[start:end]
          marker = "        thread {\n            try {"
          if marker not in reg:
              raise RuntimeError("register thread marker missing")
          reg = reg.replace(marker, "        thread {\n            var serverResponded = false\n            try {", 1)
          marker = "                val responseCode = connection.responseCode\n"
          if marker not in reg:
              raise RuntimeError("register response marker missing")
          reg = reg.replace(
              marker,
              marker + "                serverResponded = true\n                ServerConnectionStateStore.markReachable(this, raceServer.value)\n",
              1,
          )
          catch_start = reg.index("            } catch (e: Exception) {")
          function_tail = reg.rfind("\n        }\n    }\n")
          if function_tail <= catch_start:
              raise RuntimeError("register catch tail missing")
          catch = '''            } catch (e: Exception) {
              if (!serverResponded) {
                  ServerConnectionStateStore.markNoConnection(this, raceServer.value)
              }
              runOnUiThread {
                  if (currentBoatSetupValues() != registrationBoatSetup) {
                      return@runOnUiThread
                  }
                  updateConnectionUiState()
                  registerRaceStatusText.value = if (serverResponded) {
                      getString(R.string.registration_failed, e.message ?: "")
                  } else {
                      getString(R.string.status_no_connection)
                  }
              }
          }'''
          reg = reg[:catch_start] + catch + reg[function_tail:]
          MAIN.write_text(main[:start] + reg + main[end:], encoding="utf-8")

          worker = WORKER.read_text(encoding="utf-8")
          start = worker.index("    private fun uploadSampleBlocking(")
          end = worker.index("    private fun buildIngestUrl(", start)
          fn = worker[start:end]
          marker = "        return try {"
          if marker not in fn:
              raise RuntimeError("worker return marker missing")
          fn = fn.replace(marker, "        var serverResponded = false\n        return try {", 1)
          marker = "            val responseCode = connection.responseCode\n"
          if marker not in fn:
              raise RuntimeError("worker response marker missing")
          fn = fn.replace(marker, marker + "            serverResponded = true\n", 1)
          catch_start = fn.index("        } catch (e: Exception) {")
          function_tail = fn.rfind("\n    }\n")
          if function_tail <= catch_start:
              raise RuntimeError("worker catch tail missing")
          catch = '''        } catch (e: Exception) {
              if (!serverResponded) {
                  ServerConnectionStateStore.markNoConnection(applicationContext, accessContext.serverUrl)
              }
              publishDebugError(applicationContext.getString(R.string.upload_exception, e.message ?: ""))
              TelemetryUploadAttemptResult.TEMPORARY_FAILURE
          }'''
          fn = fn[:catch_start] + catch + fn[function_tail:]
          WORKER.write_text(worker[:start] + fn + worker[end:], encoding="utf-8")

          service = SERVICE.read_text(encoding="utf-8")
          marker = "            ?.let { JSONObject(it) }"
          if service.count(marker) != 1:
              raise RuntimeError("service cached-course marker missing or ambiguous")
          SERVICE.write_text(
              service.replace(marker, "            ?.let { raw -> runCatching { JSONObject(raw) }.getOrNull() }", 1),
              encoding="utf-8",
          )

          replace_between(
              STORE,
              "    private fun write(",
              "    internal fun normalizeServer(",
              '''    private fun write(
              context: Context,
              server: String,
              state: ServerConnectionState
          ) {
              val normalized = normalizeServer(server)
              if (normalized.isBlank()) return
              val prefs = context.applicationContext
                  .getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              val key = KEY_PREFIX + normalized
              if (prefs.getString(key, "") == state.name) return
              prefs.edit().putString(key, state.name).apply()
          }

          '''
          )

          test = HOME_TEST.read_text(encoding="utf-8")
          if "import de.williserv.regattaclient.ui.theme.RegattaRed\n" not in test:
              test = test.replace(
                  "import de.williserv.regattaclient.ui.theme.RegattaOrange\n",
                  "import de.williserv.regattaclient.ui.theme.RegattaOrange\nimport de.williserv.regattaclient.ui.theme.RegattaRed\n",
                  1,
              )
          HOME_TEST.write_text(test, encoding="utf-8")
          replace_between(
              HOME_TEST,
              "    private fun shortUploadStatusEnglish(",
              "    private fun shortRaceStatusEnglish(",
              '''    private fun shortUploadStatusEnglish(
              pendingUploadCount: Long,
              inRace: Boolean,
              noConnection: Boolean = false
          ): String = shortUploadStatus(
              pendingUploadCount = pendingUploadCount,
              inRace = inRace,
              pendingText = { "$it pending" },
              okText = "OK",
              noConnection = noConnection,
              noConnectionText = "No connection"
          )

          '''
          )
          test = HOME_TEST.read_text(encoding="utf-8")
          start = test.index("    @Test\n    fun pendingBacklogOutsideRace")
          end = test.index("    @Test\n    fun unavailableRaceData_", start)
          tests = '''    @Test
              fun connectedWithoutBacklog_isOkRegardlessOfRaceState() {
                  assertEquals("OK", shortUploadStatusEnglish(0L, false))
                  assertEquals("OK", shortUploadStatusEnglish(0L, true))
              }

              @Test
              fun pendingBacklogOutsideRace_isShownExplicitly() {
                  assertEquals("37 pending", shortUploadStatusEnglish(37L, false))
                  assertEquals("3 pending", shortUploadStatusEnglish(3L, false))
              }

              @Test
              fun noConnection_hasPriorityAndShowsPendingCount() {
                  assertEquals("No connection · 7 pending", shortUploadStatusEnglish(7L, true, true))
                  assertEquals("No connection", shortUploadStatusEnglish(0L, false, true))
              }

              @Test
              fun inRaceBacklog_preservesExistingCompactBehavior() {
                  assertEquals("42", shortUploadStatusEnglish(42L, true))
                  assertEquals("OK", shortUploadStatusEnglish(10L, true))
              }

              @Test
              fun uploadColor_reflectsConnectionAndBacklog() {
                  assertEquals(RegattaRed, uploadStatusColor(0L, noConnection = true))
                  assertEquals(RegattaGreen, uploadStatusColor(0L))
                  assertEquals(RegattaGreen, uploadStatusColor(10L))
                  assertEquals(RegattaOrange, uploadStatusColor(11L))
              }

          '''
          HOME_TEST.write_text(test[:start] + tests + test[end:], encoding="utf-8")

          print("#108 review fixes applied")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify final Android tree
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyBuildIdentifier test lint assembleDebug

      - name: Commit final reviewed tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue108-review-fixes.yml
          git rm .github/workflows/issue108-review-fixes-v2.yml
          git add -A
          git commit -m "Fix #108 production review findings"
          git push origin HEAD:fix/108-offline-recovery
