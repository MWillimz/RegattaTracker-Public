name: Apply legal text localization

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-legal-localization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0

      - name: Move legal copy into localized resources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          legal = Path('app/src/main/java/de/williserv/regattaclient/LegalScreen.kt')
          test = Path('app/src/test/java/de/williserv/regattaclient/LocalizationResourcesTest.kt')

          text = legal.read_text()
          replacements = [
              (
                  r'(title = stringResource\(R\.string\.legal_notice\),\n)\s*body = """.*?"""\.trimIndent\(\)',
                  r'\1            body = stringResource(R.string.legal_notice_body)'
              ),
              (
                  r'(title = stringResource\(R\.string\.privacy_policy\),\n)\s*body = """.*?"""\.trimIndent\(\)',
                  r'\1            body = stringResource(R.string.privacy_policy_body)'
              ),
              (
                  r'(title = stringResource\(R\.string\.regatta_server\),\n)\s*body = """.*?"""\.trimIndent\(\)',
                  r'\1            body = stringResource(R.string.regatta_server_body)'
              ),
              (
                  r'(title = stringResource\(R\.string\.license_notices\),\n)\s*body = """.*?"""\.trimIndent\(\)',
                  r'\1            body = stringResource(R.string.license_notices_body)'
              ),
          ]
          for pattern, replacement in replacements:
              matches = re.findall(pattern, text, flags=re.S)
              if len(matches) != 1:
                  raise SystemExit(f'{legal}: expected one match for {pattern}, found {len(matches)}')
              text = re.sub(pattern, replacement, text, count=1, flags=re.S)
          legal.write_text(text)

          resources = {
              'app/src/main/res/values/strings.xml': {
                  'legal_notice_body': 'Provider:\\nMax Willimzik\\n\\nContact:\\nwebmaster@raceoffice.williserv.de\\n\\nResponsible for contents:\\nMax Willimzik',
                  'privacy_policy_body': 'This app processes location data, boat data, and technical sensor data to provide regatta tracking.\\n\\nData processed:\\n- GPS position\\n- Timestamp\\n- Boat data\\n- Sail number\\n- Captain/skipper name\\n- Course over ground (COG)\\n- Speed over ground (SOG)\\n- GPS accuracy\\n- Acceleration and gyroscope data\\n- Event identifier, server address and server credential\\n\\nPurpose of processing:\\n- Live regatta tracking\\n- Start line check\\n- OCS detection\\n- Course progress\\n- Finish detection\\n- CSV export and later analysis\\n\\nStorage and transmission:\\nData is first stored locally on the device. During a race session, tracking data may be transmitted to the compatible regatta server configured for that race. The operator of that server is responsible for server-side processing and retention.\\n\\nAndroid backup:\\nApp-local configuration, credentials and tracking data are excluded from Android backup and device transfer.\\n\\nManual training:\\nManually recorded training data is stored locally and is not automatically transmitted to the server.\\n\\nQR scanning:\\nCamera frames used for QR scanning are processed locally and are not intentionally stored or uploaded by the app.\\n\\nConsent:\\nLocation data is only processed if the user consents to processing and grants the Android location permission.',
                  'regatta_server_body': 'The Regatta Server configured for an event is operated separately from this app.\\n\\nIts operator and legal information are specific to that server and can be found under Server information on the Event screen.',
                  'license_notices_body': 'Regatta Tracker source code:\\nGNU General Public License v3.0 or later.\\n\\nQR decoding:\\nZXing Core 3.5.4 — Apache License 2.0.\\n\\nThe full ZXing license text is bundled with the app and can be viewed below.\\n\\nMap and geodata:\\n© OpenStreetMap contributors\\n© OpenSeaMap contributors\\n\\nOpenStreetMap data is available under the Open Data Commons Open Database License (ODbL).',
              },
              'app/src/main/res/values-de/strings.xml': {
                  'legal_notice_body': 'Anbieter:\\nMax Willimzik\\n\\nKontakt:\\nwebmaster@raceoffice.williserv.de\\n\\nVerantwortlich für die Inhalte:\\nMax Willimzik',
                  'privacy_policy_body': 'Diese App verarbeitet Standortdaten, Bootsdaten und technische Sensordaten, um Regatta-Tracking bereitzustellen.\\n\\nVerarbeitete Daten:\\n- GPS-Position\\n- Zeitstempel\\n- Bootsdaten\\n- Segelnummer\\n- Name des Skippers/Kapitäns\\n- Kurs über Grund (COG)\\n- Geschwindigkeit über Grund (SOG)\\n- GPS-Genauigkeit\\n- Beschleunigungs- und Gyroskopdaten\\n- Veranstaltungskennung, Serveradresse und Server-Zugangsdaten\\n\\nZweck der Verarbeitung:\\n- Live-Regatta-Tracking\\n- Prüfung der Startlinie\\n- OCS-Erkennung\\n- Kursfortschritt\\n- Zielerkennung\\n- CSV-Export und spätere Analyse\\n\\nSpeicherung und Übertragung:\\nDie Daten werden zunächst lokal auf dem Gerät gespeichert. Während einer Regatta können Trackingdaten an den für diese Regatta konfigurierten kompatiblen Regatta-Server übertragen werden. Der Betreiber dieses Servers ist für die serverseitige Verarbeitung und Aufbewahrung verantwortlich.\\n\\nAndroid-Sicherung:\\nApp-interne Konfiguration, Zugangsdaten und Trackingdaten sind von Android-Sicherungen und Geräteübertragungen ausgeschlossen.\\n\\nManuelles Training:\\nManuell aufgezeichnete Trainingsdaten werden lokal gespeichert und nicht automatisch an den Server übertragen.\\n\\nQR-Scan:\\nKamerabilder für den QR-Scan werden lokal verarbeitet und von der App nicht absichtlich gespeichert oder hochgeladen.\\n\\nEinwilligung:\\nStandortdaten werden nur verarbeitet, wenn der Nutzer der Verarbeitung zustimmt und die Android-Standortberechtigung erteilt.',
                  'regatta_server_body': 'Der für eine Veranstaltung konfigurierte Regatta-Server wird unabhängig von dieser App betrieben.\\n\\nBetreiber und rechtliche Informationen sind serverspezifisch und unter Serverinformationen auf der Veranstaltungsseite in der App zu finden.',
                  'license_notices_body': 'Quellcode von Regatta Tracker:\\nGNU General Public License v3.0 oder neuer.\\n\\nQR-Dekodierung:\\nZXing Core 3.5.4 — Apache License 2.0.\\n\\nDer vollständige ZXing-Lizenztext ist in der App enthalten und kann unten angezeigt werden.\\n\\nKarten- und Geodaten:\\n© OpenStreetMap-Mitwirkende\\n© OpenSeaMap-Mitwirkende\\n\\nOpenStreetMap-Daten sind unter der Open Data Commons Open Database License (ODbL) verfügbar.',
              },
              'app/src/main/res/values-fr/strings.xml': {
                  'legal_notice_body': 'Éditeur :\\nMax Willimzik\\n\\nContact :\\nwebmaster@raceoffice.williserv.de\\n\\nResponsable du contenu :\\nMax Willimzik',
                  'privacy_policy_body': 'Cette application traite des données de localisation, des données du bateau et des données techniques de capteurs afin d’assurer le suivi de régate.\\n\\nDonnées traitées :\\n- Position GPS\\n- Horodatage\\n- Données du bateau\\n- Numéro de voile\\n- Nom du capitaine/skipper\\n- Route fond (COG)\\n- Vitesse fond (SOG)\\n- Précision GPS\\n- Données d’accéléromètre et de gyroscope\\n- Identifiant de l’événement, adresse du serveur et identifiant d’accès au serveur\\n\\nFinalités du traitement :\\n- Suivi de régate en direct\\n- Contrôle de la ligne de départ\\n- Détection OCS\\n- Progression sur le parcours\\n- Détection de l’arrivée\\n- Export CSV et analyse ultérieure\\n\\nStockage et transmission :\\nLes données sont d’abord stockées localement sur l’appareil. Pendant une régate, les données de suivi peuvent être transmises au serveur de régate compatible configuré pour cette régate. L’opérateur de ce serveur est responsable du traitement et de la conservation côté serveur.\\n\\nSauvegarde Android :\\nLa configuration locale de l’application, les identifiants d’accès et les données de suivi sont exclus de la sauvegarde Android et du transfert d’appareil.\\n\\nEntraînement manuel :\\nLes données d’entraînement enregistrées manuellement sont stockées localement et ne sont pas transmises automatiquement au serveur.\\n\\nScan QR :\\nLes images de la caméra utilisées pour scanner les codes QR sont traitées localement et ne sont pas intentionnellement stockées ni envoyées par l’application.\\n\\nConsentement :\\nLes données de localisation ne sont traitées que si l’utilisateur y consent et accorde l’autorisation de localisation Android.',
                  'regatta_server_body': 'Le serveur de régate configuré pour un événement est exploité séparément de cette application.\\n\\nSon opérateur et ses informations légales sont propres à ce serveur et sont disponibles sous Informations serveur sur l’écran de l’événement.',
                  'license_notices_body': 'Code source de Regatta Tracker :\\nGNU General Public License v3.0 ou ultérieure.\\n\\nDécodage QR :\\nZXing Core 3.5.4 — Apache License 2.0.\\n\\nLe texte complet de la licence ZXing est inclus dans l’application et peut être consulté ci-dessous.\\n\\nCartes et géodonnées :\\n© contributeurs OpenStreetMap\\n© contributeurs OpenSeaMap\\n\\nLes données OpenStreetMap sont disponibles sous l’Open Data Commons Open Database License (ODbL).',
              },
              'app/src/main/res/values-it/strings.xml': {
                  'legal_notice_body': 'Fornitore:\\nMax Willimzik\\n\\nContatto:\\nwebmaster@raceoffice.williserv.de\\n\\nResponsabile dei contenuti:\\nMax Willimzik',
                  'privacy_policy_body': 'Questa app tratta dati di localizzazione, dati dell’imbarcazione e dati tecnici dei sensori per fornire il tracciamento della regata.\\n\\nDati trattati:\\n- Posizione GPS\\n- Timestamp\\n- Dati dell’imbarcazione\\n- Numero velico\\n- Nome del capitano/skipper\\n- Rotta rispetto al fondo (COG)\\n- Velocità rispetto al fondo (SOG)\\n- Precisione GPS\\n- Dati di accelerometro e giroscopio\\n- Identificativo dell’evento, indirizzo del server e credenziale del server\\n\\nFinalità del trattamento:\\n- Tracciamento della regata in tempo reale\\n- Controllo della linea di partenza\\n- Rilevamento OCS\\n- Avanzamento sul percorso\\n- Rilevamento dell’arrivo\\n- Esportazione CSV e analisi successiva\\n\\nArchiviazione e trasmissione:\\nI dati vengono inizialmente archiviati localmente sul dispositivo. Durante una regata, i dati di tracciamento possono essere trasmessi al server di regata compatibile configurato per quella regata. Il gestore del server è responsabile del trattamento e della conservazione lato server.\\n\\nBackup Android:\\nLa configurazione locale dell’app, le credenziali e i dati di tracciamento sono esclusi dal backup Android e dal trasferimento del dispositivo.\\n\\nAllenamento manuale:\\nI dati di allenamento registrati manualmente vengono archiviati localmente e non sono trasmessi automaticamente al server.\\n\\nScansione QR:\\nI fotogrammi della fotocamera usati per la scansione dei codici QR vengono elaborati localmente e non sono intenzionalmente archiviati o caricati dall’app.\\n\\nConsenso:\\nI dati di localizzazione vengono trattati solo se l’utente acconsente al trattamento e concede l’autorizzazione di localizzazione Android.',
                  'regatta_server_body': 'Il server di regata configurato per un evento è gestito separatamente da questa app.\\n\\nIl gestore e le informazioni legali sono specifici del server e sono disponibili in Informazioni server nella schermata dell’evento.',
                  'license_notices_body': 'Codice sorgente di Regatta Tracker:\\nGNU General Public License v3.0 o successiva.\\n\\nDecodifica QR:\\nZXing Core 3.5.4 — Apache License 2.0.\\n\\nIl testo completo della licenza ZXing è incluso nell’app e può essere visualizzato qui sotto.\\n\\nMappe e geodati:\\n© collaboratori OpenStreetMap\\n© collaboratori OpenSeaMap\\n\\nI dati OpenStreetMap sono disponibili secondo la Open Data Commons Open Database License (ODbL).',
              },
              'app/src/main/res/values-es/strings.xml': {
                  'legal_notice_body': 'Proveedor:\\nMax Willimzik\\n\\nContacto:\\nwebmaster@raceoffice.williserv.de\\n\\nResponsable de los contenidos:\\nMax Willimzik',
                  'privacy_policy_body': 'Esta aplicación trata datos de ubicación, datos del barco y datos técnicos de sensores para proporcionar el seguimiento de regata.\\n\\nDatos tratados:\\n- Posición GPS\\n- Marca temporal\\n- Datos del barco\\n- Número de vela\\n- Nombre del capitán/patrón\\n- Rumbo sobre el fondo (COG)\\n- Velocidad sobre el fondo (SOG)\\n- Precisión GPS\\n- Datos del acelerómetro y giroscopio\\n- Identificador del evento, dirección del servidor y credencial del servidor\\n\\nFinalidades del tratamiento:\\n- Seguimiento de regata en directo\\n- Comprobación de la línea de salida\\n- Detección OCS\\n- Progreso del recorrido\\n- Detección de llegada\\n- Exportación CSV y análisis posterior\\n\\nAlmacenamiento y transmisión:\\nLos datos se almacenan primero de forma local en el dispositivo. Durante una regata, los datos de seguimiento pueden transmitirse al servidor de regata compatible configurado para esa regata. El operador de ese servidor es responsable del tratamiento y la conservación en el servidor.\\n\\nCopia de seguridad de Android:\\nLa configuración local de la aplicación, las credenciales y los datos de seguimiento están excluidos de la copia de seguridad de Android y de la transferencia del dispositivo.\\n\\nEntrenamiento manual:\\nLos datos de entrenamiento registrados manualmente se almacenan de forma local y no se transmiten automáticamente al servidor.\\n\\nEscaneo QR:\\nLos fotogramas de la cámara utilizados para escanear códigos QR se procesan localmente y la aplicación no los almacena ni los sube de forma intencionada.\\n\\nConsentimiento:\\nLos datos de ubicación solo se tratan si el usuario consiente el tratamiento y concede el permiso de ubicación de Android.',
                  'regatta_server_body': 'El servidor de regata configurado para un evento se gestiona por separado de esta aplicación.\\n\\nSu operador y la información legal son específicos de ese servidor y pueden consultarse en Información del servidor, en la pantalla del evento.',
                  'license_notices_body': 'Código fuente de Regatta Tracker:\\nGNU General Public License v3.0 o posterior.\\n\\nDecodificación QR:\\nZXing Core 3.5.4 — Apache License 2.0.\\n\\nEl texto completo de la licencia de ZXing está incluido en la aplicación y puede consultarse a continuación.\\n\\nMapas y geodatos:\\n© colaboradores de OpenStreetMap\\n© colaboradores de OpenSeaMap\\n\\nLos datos de OpenStreetMap están disponibles bajo la Open Data Commons Open Database License (ODbL).',
              },
          }

          for filename, entries in resources.items():
              path = Path(filename)
              xml = path.read_text()
              for key in entries:
                  if f'name="{key}"' in xml:
                      raise SystemExit(f'{path}: duplicate resource {key}')
              anchor = '<string name="third_party_license_unavailable">'
              idx = xml.find(anchor)
              if idx < 0:
                  raise SystemExit(f'{path}: legal insertion anchor missing')
              block = ''.join(
                  f'    <string name="{key}">{value}</string>\n'
                  for key, value in entries.items()
              )
              xml = xml[:idx] + block + xml[idx:]
              path.write_text(xml)

          test_text = test.read_text()
          assertions = {
              '@Config(qualifiers = "de")\n    fun germanLocale_usesGermanResources() {': '        assertEquals("Anbieter:", resources.getString(R.string.legal_notice_body).lineSequence().first())\n',
              '@Config(qualifiers = "fr")\n    fun frenchLocale_usesFrenchResources() {': '        assertEquals("Éditeur :", resources.getString(R.string.legal_notice_body).lineSequence().first())\n',
              '@Config(qualifiers = "it")\n    fun italianLocale_usesItalianResources() {': '        assertEquals("Fornitore:", resources.getString(R.string.legal_notice_body).lineSequence().first())\n',
              '@Config(qualifiers = "es")\n    fun spanishLocale_usesSpanishResources() {': '        assertEquals("Proveedor:", resources.getString(R.string.legal_notice_body).lineSequence().first())\n',
          }
          for method_anchor, assertion in assertions.items():
              start = test_text.find(method_anchor)
              if start < 0:
                  raise SystemExit(f'{test}: test anchor missing: {method_anchor}')
              body_anchor = test_text.find('        assertEquals(', start)
              if body_anchor < 0:
                  raise SystemExit(f'{test}: assertion anchor missing')
              test_text = test_text[:body_anchor] + assertion + test_text[body_anchor:]
          test.write_text(test_text)
          PY

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-legal-localization.yml
          git add app/src/main/java/de/williserv/regattaclient/LegalScreen.kt \
                  app/src/main/res/values/strings.xml \
                  app/src/main/res/values-de/strings.xml \
                  app/src/main/res/values-es/strings.xml \
                  app/src/main/res/values-fr/strings.xml \
                  app/src/main/res/values-it/strings.xml \
                  app/src/test/java/de/williserv/regattaclient/LocalizationResourcesTest.kt
          git diff --cached --check
          git commit -m "Localize static legal screen content"
          git push origin HEAD:feature/64-localize-ui-strings
