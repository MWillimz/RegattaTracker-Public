name: Apply GPS localization hardening

on:
  push:
    branches:
      - feature/64-localize-ui-strings
    paths:
      - .github/workflows/patch-gps-localization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/64-localize-ui-strings
          fetch-depth: 0

      - name: Apply GPS state patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          home = Path('app/src/main/java/de/williserv/regattaclient/HomeScreen.kt')
          main = Path('app/src/main/java/de/williserv/regattaclient/MainActivity.kt')

          replace_once(
              home,
              '    val gpsPrefix = stringResource(R.string.gps_prefix)\n',
              ''
          )
          replace_once(
              home,
              '    val gpsStatus = gpsStatusLabel(gpsAccuracyText, gpsPrefix)\n',
              '    val gpsStatus = ""\n'
          )
          replace_once(
              home,
              '            gpsColor = gpsStatusColor(gpsAccuracyText, gpsPrefix),\n',
              '            gpsColor = gpsColor,\n'
          )

          text = home.read_text()
          pattern = r'\nfun gpsStatusLabel\(.*?\n\}\n\nfun isRaceFinished\('
          matches = re.findall(pattern, text, flags=re.S)
          if len(matches) != 1:
              raise SystemExit(f'{home}: expected one GPS helper block, found {len(matches)}')
          text = re.sub(pattern, '\nfun isRaceFinished(', text, count=1, flags=re.S)
          home.write_text(text)

          replace_once(
              main,
              '        gpsAccuracyText.value = getString(R.string.gps_accuracy_value, 0.0)\n',
              '        gpsAccuracyText.value = getString(R.string.gps_accuracy_unknown)\n'
          )

          resource_paths = [
              Path('app/src/main/res/values/strings.xml'),
              Path('app/src/main/res/values-de/strings.xml'),
              Path('app/src/main/res/values-es/strings.xml'),
              Path('app/src/main/res/values-fr/strings.xml'),
              Path('app/src/main/res/values-it/strings.xml'),
          ]
          for path in resource_paths:
              text = path.read_text()
              if 'name="gps_accuracy_unknown"' in text:
                  raise SystemExit(f'{path}: gps_accuracy_unknown already exists')
              anchor = re.search(r'(^\s*<string name="gps_accuracy_value">.*?</string>\s*$)', text, flags=re.M)
              if not anchor:
                  raise SystemExit(f'{path}: gps_accuracy_value anchor missing')
              insertion = anchor.group(1) + '\n    <string name="gps_accuracy_unknown">GPS: --</string>'
              path.write_text(text[:anchor.start()] + insertion + text[anchor.end():])
          PY

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-gps-localization.yml
          git add app/src/main/java/de/williserv/regattaclient/HomeScreen.kt \
                  app/src/main/java/de/williserv/regattaclient/MainActivity.kt \
                  app/src/main/res/values/strings.xml \
                  app/src/main/res/values-de/strings.xml \
                  app/src/main/res/values-es/strings.xml \
                  app/src/main/res/values-fr/strings.xml \
                  app/src/main/res/values-it/strings.xml
          git diff --cached --check
          git commit -m "Keep GPS status independent of localized text"
          git push origin HEAD:feature/64-localize-ui-strings
